name: import-video

# issue 驱动的云端导入流水线：
# 学习站「导入」页生成预填 issue → 链接先入库（或旧请求抓取字幕）→ push 触发 Pages 上线
on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: write

concurrency:
  group: import-video
  cancel-in-progress: false

jobs:
  import:
    # 仅仓库所有者的 issue 触发（公开仓库防陌生人滥用）
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Choose import mode
        id: mode
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$ISSUE_TITLE" == "导入视频:"* ]]; then
            echo "mode=link" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'full'
        with:
          node-version: "22"

      - name: Install deps
        if: steps.mode.outputs.mode == 'full'
        run: pip install yt-dlp requests bgutil-ytdlp-pot-provider==2.0.2

      - name: Start PO token provider (bgutil)
        if: steps.mode.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bg
          cd /tmp/bg/server
          npm ci --no-audit --no-fund
          npx tsc
          nohup node build/main.js > /tmp/bgutil.log 2>&1 &
          BGUTIL_PID=$!
          for i in 1 2 3 4 5 6; do
            sleep 2
            if curl -fsS http://127.0.0.1:4416/ping > /dev/null; then
              echo "PO provider up"
              exit 0
            fi
            if ! kill -0 "$BGUTIL_PID" 2>/dev/null; then break; fi
          done
          echo "ERROR: PO token provider did not become healthy"
          cat /tmp/bgutil.log
          exit 1

      - name: Extract video URL
        id: url
        env:
          TEXT: ${{ github.event.issue.title }} — ${{ github.event.issue.body }}
        run: |
          URL="$(printf '%s' "$TEXT" | grep -oE 'https?://[^[:space:]">)]+' | head -1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Import pipeline
        id: imp
        if: steps.url.outputs.url != ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          BI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          IMPORT_MODE: ${{ steps.mode.outputs.mode }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          VIDEO_URL: ${{ steps.url.outputs.url }}
        run: python tools/action_import.py "$VIDEO_URL"

      - name: Commit & push
        id: commit
        if: steps.imp.outputs.result == 'imported' || steps.imp.outputs.result == 'video_only'
        env:
          EP_TITLE: ${{ steps.imp.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "import-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/episodes-imported.js
          git commit -m "import: ${EP_TITLE:0:100} (#${ISSUE_NUMBER})"
          git push

      - name: Report on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.imp.outputs.result }}
          EP: ${{ steps.imp.outputs.ep_id }}
          TITLE: ${{ steps.imp.outputs.title }}
          REASON: ${{ steps.imp.outputs.reason }}
          PUSH_OUTCOME: ${{ steps.commit.outcome }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if { [ "$RESULT" = "imported" ] || [ "$RESULT" = "video_only" ]; } && [ "$PUSH_OUTCOME" != "success" ]; then
            gh issue comment "$NUM" --body "❌ 视频已处理但提交仓库失败，请查看本次 Actions 日志后 reopen 重试。"
          elif [ "$RESULT" = "imported" ]; then
            gh issue comment "$NUM" --body "✅ 已导入 **$TITLE**（$EP，翻译模式见 Actions 日志）。1-2 分钟后刷新学习站目录即可看到新语料。"
            gh issue close "$NUM"
          elif [ "$RESULT" = "video_only" ]; then
            gh issue comment "$NUM" --body "✅ 视频已入库（$EP）。1-2 分钟后刷新学习站即可播放；目前没有学习字幕，可在视频页添加 SRT/VTT（仅保存在当前浏览器）。"
            gh issue close "$NUM"
          elif [ "$RESULT" = "exists" ]; then
            gh issue comment "$NUM" --body "ℹ️ 该视频已在语料库中，无需重复导入。"
            gh issue close "$NUM"
          elif [ "$RESULT" = "error" ]; then
            gh issue comment "$NUM" --body "❌ 导入失败：$REASON（修正后可 reopen 重试）"
            gh issue close "$NUM"
          else
            gh issue comment "$NUM" --body "❌ 未在 issue 中识别到视频链接。请贴 YouTube / B站 视频页完整链接后 reopen。" || true
          fi
